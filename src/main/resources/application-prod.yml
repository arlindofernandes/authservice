spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  key-id: ${JWT_KEY_ID}
  expiration: ${JWT_EXPIRATION}

admin:
  registration:
    token: ${ADMIN_REGISTRATION_TOKEN}

management:
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}
