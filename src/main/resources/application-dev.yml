spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  issuer: ${JWT_ISSUER:auth-service-dev}
  audience: ${JWT_AUDIENCE:auth-service-clients}
  key-id: ${JWT_KEY_ID:auth-service-dev-1}
  expiration: ${JWT_EXPIRATION:900000}

admin:
  registration:
    token: ${ADMIN_REGISTRATION_TOKEN:local-development-admin-token}
