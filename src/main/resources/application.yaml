spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:3000}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:2000}

server:
  shutdown: graceful
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT_MS:5000}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
