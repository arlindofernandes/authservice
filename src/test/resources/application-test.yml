spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

  sql:
    init:
      mode: never

