services:
  db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: redis-auth
    ports:
      - "6379:6379"
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  postgres_data: