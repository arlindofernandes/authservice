services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth}
      POSTGRES_DB: ${DB_NAME:-authdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-authservice:dev}
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0}
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres_data:
